name: Verify and deploy demo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - run: npm run setup
      - run: npm --prefix cloudflare ci
      - run: npm run typecheck && npm --prefix cloudflare run check
      - run: npm run test:unit
      - run: npm --prefix cloudflare run build
      - name: Official client E2E against Node server
        run: |
          node --import tsx server.ts >server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for _attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18889/health; then break; fi
            sleep 1
          done
          npm test
      - name: Cloudflare anonymous trip isolation
        run: |
          node -e "require('fs').writeFileSync('cloudflare/.dev.vars','DEMO_SESSION_SECRET='+require('crypto').randomBytes(32).toString('hex'))"
          npm --prefix cloudflare run dev >worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID"' EXIT
          for _attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18891/health; then break; fi
            sleep 1
          done
          npm run test:isolation

  deploy:
    name: Deploy Cloudflare production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://flights.mcpjam.com
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - run: npm run setup
      - run: npm --prefix cloudflare ci
      - name: Skip a commit superseded on main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo 'A newer commit is on main; skipping this older deployment.'
          fi
      - name: Check deployment credentials
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing production environment secret CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing production environment variable CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Deploy the verified commit
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm --prefix cloudflare run deploy
      - name: Verify the deployed endpoint
        if: steps.current.outputs.deploy == 'true'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 15 https://flights.mcpjam.com/health
          npm run test:isolation -- https://flights.mcpjam.com/mcp
