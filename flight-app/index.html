<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your flight · MCPJam</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: var(--font-sans, Inter, system-ui, sans-serif);
        color: var(--color-text-primary, #182c36);
        background: var(--color-background-primary, #fff);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .brand {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.03em;
      }
      .brand span {
        color: #1c857b;
      }
      .tag {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.3px;
        color: var(--color-text-secondary, #727e86);
      }
      h1 {
        font-size: 20px;
        font-weight: 550;
        letter-spacing: -0.5px;
        margin: 28px 0 6px;
      }
      .date {
        font-size: 12px;
        color: var(--color-text-secondary, #727e86);
      }
      .route {
        display: flex;
        align-items: center;
        gap: 20px;
        margin: 30px 0;
      }
      .airport {
        font-size: 38px;
        letter-spacing: -2px;
        font-weight: 600;
      }
      .city {
        font-size: 11px;
        color: var(--color-text-secondary, #727e86);
        margin-top: 3px;
      }
      .path {
        flex: 1;
        text-align: center;
        position: relative;
        color: #1c857b;
      }
      .path:before {
        content: "";
        position: absolute;
        top: 50%;
        height: 1px;
        background: #b9d4cf;
        left: 0;
        right: 0;
      }
      .path span {
        position: relative;
        padding: 0 10px;
        background: var(--color-background-primary, #fff);
        font-size: 23px;
      }
      .status {
        border-radius: 9px;
        background: #edf7f2;
        padding: 15px 18px;
        color: #237050;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        font-size: 13px;
      }
      .status.delayed {
        background: #fff3db;
        color: #915d0d;
      }
      .status.cancelled {
        background: #fdeceb;
        color: #a4413a;
      }
      .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        margin-right: 8px;
      }
      .schedule {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        padding: 22px 0;
        border-bottom: 1px solid var(--color-border-primary, #e5eaeb);
      }
      .label {
        font-size: 11px;
        color: var(--color-text-secondary, #727e86);
        margin-bottom: 8px;
      }
      .time {
        font-size: 22px;
        letter-spacing: -0.6px;
      }
      .old {
        font-size: 12px;
        text-decoration: line-through;
        color: var(--color-text-secondary, #727e86);
        margin-left: 8px;
      }
      .zone {
        font-size: 10px;
        color: var(--color-text-secondary, #727e86);
        margin-top: 4px;
      }
      .notice {
        font-size: 12px;
        line-height: 1.6;
        color: var(--color-text-secondary, #727e86);
        margin: 18px 0;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 14px;
        font-size: 10px;
        color: var(--color-text-secondary, #727e86);
      }
      button {
        font: inherit;
        background: transparent;
        color: inherit;
        border: 1px solid var(--color-border-primary, #d7e0e3);
        border-radius: 6px;
        padding: 7px 10px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #1c857b;
        outline-offset: 3px;
      }
      #error {
        color: #a4413a;
        font-size: 12px;
      }
      #loading {
        padding: 40px 0;
        color: #727e86;
        font-size: 13px;
      }
      [hidden] {
        display: none !important;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --color-background-primary: #192329;
          --color-text-primary: #e5edf0;
          --color-text-secondary: #a1afb5;
          --color-border-primary: #35444c;
        }
        .status {
          background: #213b32;
          color: #93d6b5;
        }
        .status.delayed {
          background: #3c3320;
          color: #f1cc86;
        }
        .status.cancelled {
          background: #422b2c;
          color: #f1aaa5;
        }
      }
      @media (max-width: 380px) {
        body {
          padding: 16px;
        }
        .route {
          gap: 12px;
        }
        .airport {
          font-size: 32px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">✈ MCP<span>Jam</span> Airways</div>
      <span class="tag">Demo flight</span>
    </header>
    <div id="loading">Loading your flight…</div>
    <main id="trip" hidden>
      <h1 id="title"></h1>
      <div id="date" class="date"></div>
      <div class="route">
        <div>
          <div class="airport" id="origin"></div>
          <div class="city" id="originCity"></div>
        </div>
        <div class="path" aria-hidden="true"><span>✈</span></div>
        <div>
          <div class="airport" id="destination"></div>
          <div class="city" id="destinationCity"></div>
        </div>
      </div>
      <div class="status" id="status" role="status" aria-live="polite">
        <strong><span class="dot"></span><span id="statusText"></span></strong
        ><span id="delay"></span>
      </div>
      <div class="schedule">
        <div>
          <div class="label">Departure</div>
          <span class="time" id="departure"></span
          ><span class="old" id="oldDeparture"></span>
          <div class="zone" id="departureZone"></div>
        </div>
        <div>
          <div class="label">Arrival</div>
          <span class="time" id="arrival"></span
          ><span class="old" id="oldArrival"></span>
          <div class="zone" id="arrivalZone"></div>
        </div>
      </div>
      <p class="notice" id="notice"></p>
      <div class="footer">
        <span id="updated"></span><button id="refresh">Refresh status</button>
      </div>
    </main>
    <p id="error" role="alert" hidden></p>
    <script type="module">
      /* APP_SCRIPT */
    </script>
  </body>
</html>
